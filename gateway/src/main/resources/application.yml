server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: "*"
            exposedHeaders: [X-Trace-Id]
      routes:
        - id: auth
          uri: ${AUTH_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**
        - id: premieres
          uri: ${PREMIERES_URL:http://localhost:8082}
          predicates:
            - Path=/api/premieres/**
        - id: candystore
          uri: ${CANDYSTORE_URL:http://localhost:8083}
          predicates:
            - Path=/api/candystore/**
        - id: complete
          uri: ${COMPLETE_URL:http://localhost:8084}
          predicates:
            - Path=/api/payments/**,/api/complete/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
